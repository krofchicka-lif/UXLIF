function TwoPhones({ items }) {

}

function CorePrinciple() {
  const lines = ['There is no forwarding.', 'Every continuation is a new purchase.', 'Every new purchase creates a new customer.'];
  return (
    <div className="lif-grain-el" style={{ width: '100%', height: '100%', background: C.air, padding: '56px 52px', boxSizing: 'border-box', display: 'flex', flexDirection: 'column', justifyContent: 'center', overflow: 'hidden' }}>

          That is the business model. Everything else is UX.
        </div>
      </div>
    </div>
  );
}

function BlockingNotes() {
  const items = [
    ['lif_id persistence', 'The lif_id must travel from Email 1 click through lif.co reveal through the welcome screen into the Moon Juice homepage and through all Moon Juice navigation into checkout where it applies the value automatically. It must survive page navigation without breaking. Options: cookie, session storage, or URL parameter passed through every page. Tal to confirm approach in Session 1. If this breaks, the entire receiver experience breaks. The highest priority technical dependency in the build.'],
    ['email capture webhook', "When Jody submits her email on Page 12: check if email exists in Shopify customer database, create new customer record if not, attach discount code to her session, fire webhook to LIF recording lif_id plus Jody's email plus timestamp plus Amy as introducer. This is how the Trust Map records the introduction. Tal to spec the webhook payload and confirm Shopify customer creation flow."],
    ['discount code mechanics', 'The LIF value is a Shopify discount code. It must apply automatically at checkout without Jody entering it, cover up to its value with Jody paying any difference, burn unused value on redemption, and be invisible to Jody at all times. Questions for Tal: how is the code generated per LIF, how does it attach to Jody\u2019s session after email capture, how does it survive cart and page navigation without being exposed.'],
  ];
  return (
    <div style={{ width: '100%', height: '100%', background: '#2F2B2B', padding: '34px 32px', boxSizing: 'border-box', overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: 16 }}>

        </div>
      ))}
    </div>
  );
}

function OverviewCard() {

  return (
    <div className="lif-grain-el" style={{ width: '100%', height: '100%', background: C.air, padding: '46px 50px', boxSizing: 'border-box', fontFamily: F.sans, overflow: 'hidden' }}>

          <div style={{ fontFamily: F.display, fontSize: 48, lineHeight: 0.98, letterSpacing: '-.03em', color: C.ink, maxWidth: '15ch' }}>

        </div>
        <div style={{ display: 'flex', alignItems: 'center', flexWrap: 'wrap', gap: 9, marginBottom: 18 }}>
          {chain.map((step, i) => (

                <span style={{ fontFamily: F.sans, fontWeight: 600, fontSize: 15, color: C.ink }}>{s.t}</span>

              <div style={{ fontFamily: F.ui, fontSize: 13, lineHeight: 1.5, color: '#6B6664' }}>{s.d}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function Lif12Note() {
  const points = [
    'The lif_id travels in the URL invisibly, from Email 1 through the entire Moon Juice session.',
    'Email submission creates or matches a Shopify customer record and attaches the discount to the session.',

          <span style={{ width: 8, height: 8, borderRadius: '50%', background: C.sol }} /> Page 12 · the check-in, not the checkout
        </div>
        <div style={{ fontFamily: F.display, fontSize: 27, lineHeight: 1.08, letterSpacing: '-.02em', color: C.ink, marginBottom: 20, maxWidth: '24ch' }}>Email submission is the customer acquisition moment. Not checkout. The check-in.</div>

              <span style={{ fontFamily: F.sans, fontWeight: 300, fontSize: 14.5, lineHeight: 1.45, color: C.ink }}>{p}</span>

function LoopBack() {
  const steps = ['Jody re-enters the giver flow at Page 3', 'She chooses Rachel and pays', 'Email 5 fires to Amy', 'Email 1 fires to Rachel', 'The cycle restarts at Page 7 for Rachel'];
  return (
    <div className="lif-grain-el" style={{ width: '100%', height: '100%', background: C.air, padding: '44px 48px', boxSizing: 'border-box', display: 'flex', flexDirection: 'column', justifyContent: 'center', overflow: 'hidden' }}>
